services:
  php82:
    container_name: laravel-clickhouse-lib-82
    build:
      context: ./
      dockerfile: ./.docker/php.Dockerfile
      args:
        PHP_VERSION: "8.2"
    tty: true
    working_dir: /app
    volumes:
      - ./:/app

  php83:
    container_name: laravel-clickhouse-lib-83
    build:
      context: ./
      dockerfile: ./.docker/php.Dockerfile
      args:
        PHP_VERSION: "8.3"
    tty: true
    working_dir: /app
    volumes:
      - ./:/app

  php84:
    container_name: laravel-clickhouse-lib-84
    build:
      context: ./
      dockerfile: ./.docker/php.Dockerfile
      args:
        PHP_VERSION: "8.4"
    tty: true
    working_dir: /app
    volumes:
      - ./:/app

  php85:
    container_name: laravel-clickhouse-lib-85
    build:
      context: ./
      dockerfile: ./.docker/php.Dockerfile
      args:
        PHP_VERSION: "8.5"
    tty: true
    working_dir: /app
    volumes:
      - ./:/app

  clickhouse:
    container_name: laravel-clickhouse-clickhouse
    # Supported server range: 22.8 LTS and up. This pin tracks the current LTS as a dev
    # convenience, it is not the contract — the minimum is enforced by the CI integration
    # job. To test the floor — --renew-anon-volumes because the data directory lives in an
    # anonymous volume a plain recreate carries over, and an older server cannot read what
    # a newer one wrote there:
    # CLICKHOUSE_IMAGE=clickhouse/clickhouse-server:22.8-alpine docker compose up -d --renew-anon-volumes
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.3-alpine}
    environment:
      # Newer images generate a random password for the `default` user otherwise.
      CLICKHOUSE_SKIP_USER_SETUP: 1
    volumes:
      - ./.docker/clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./.docker/clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
    healthcheck:
      test: wget --spider -q 127.0.0.1:8123/ping
      interval: 5s
      timeout: 3s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123"
      - "9000:9000"
